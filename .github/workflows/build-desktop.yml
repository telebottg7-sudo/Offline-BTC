name: Build Desktop Executable Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.os }} Distribution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          npm install --include=optional
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm install --no-save @rollup/rollup-win32-x64-msvc@4.63.3
          fi

      - name: Build Web Assets and Electron Main/Preload
        run: npm run desktop:build

      - name: Package Executables with electron-builder
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biotechcentre-${{ runner.os }}-dist
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.zip
          if-no-files-found: warn

      - name: Release to GitHub Releases (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
